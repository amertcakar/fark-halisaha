<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f8a4c">
<title>Fark Halı Saha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f7f1; --card:#ffffff; --ink:#16301f; --green:#1d5c34; --green2:#2f8a4c; --grass1:#2f8a4c; --grass2:#297a43;
    --muted:#5f7568; --faint:#9bb0a3; --line:#dfe7da; --mine:#e3f2e3;
    --yellow:#ffe14d; --teal:#13a89e; --yellow-ink:#3d3200; --red:#c8402a; --amber:#b9770e;
    --display:"Barlow Condensed","Arial Narrow",sans-serif; --mono:"Barlow Condensed","Arial Narrow",sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,select{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--green)}
  .mark b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:3px;line-height:1}
  .mark span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.3px}
  .me-btn{display:flex;align-items:center;text-decoration:none}
  .me-btn i{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:16px}
  .demo{font-size:12px;font-weight:600;background:var(--yellow);color:var(--yellow-ink);padding:4px 9px;border-radius:999px}

  /* alt menü */
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  .nav div{display:flex;max-width:720px;width:100%}
  .nav a{flex:1;text-align:center;text-decoration:none;color:var(--faint);font-size:12px;font-weight:600;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav a svg{width:22px;height:22px}
  .nav a.on{color:var(--green)}
  .nav a.on svg{background:var(--mine);border-radius:999px;padding:2px 12px;width:46px;box-sizing:content-box;height:22px;margin:-2px 0}

  /* saha başlığı (çizgili çim) */
  .pitch{position:relative;overflow:hidden;color:#fff;border-radius:var(--r);background:repeating-linear-gradient(90deg,var(--grass1) 0 44px,var(--grass2) 44px 88px)}
  .pitch::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.5);border-radius:6px;pointer-events:none}
  .pitch::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;border-left:2px solid rgba(255,255,255,.35);pointer-events:none}
  .pitch > *{position:relative;z-index:1}
  .pitch .circle{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border:2px solid rgba(255,255,255,.35);border-radius:50%;z-index:0}
  .board{padding:22px 22px 20px;margin-top:6px}
  .status{font-size:13px;font-weight:600;letter-spacing:.5px;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:999px}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--yellow);display:inline-block}
  .status.closed i{background:#ff8a75}
  .day{font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,64px);line-height:1;margin:12px 0 2px}
  .date{font-size:17px;font-weight:500}
  .place{margin-top:6px;font-size:15px;opacity:.95}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .olink{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(255,255,255,.75);color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:9px 13px;border-radius:10px;background:rgba(0,0,0,.08)}
  .olink.lime{background:#fff;border-color:#fff;color:var(--green)}
  .olink svg{width:15px;height:15px}

  .count{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:20px 0 10px}
  .big{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;color:var(--green)}
  .big span{color:var(--faint)}
  .meta{font-size:14px;color:var(--muted);text-align:right;line-height:1.5}
  .ticks{display:grid;gap:4px}
  .ticks i{height:10px;background:var(--line);border-radius:3px}
  .ticks i.on{background:var(--green2)}

  .vote{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .q{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 2px;color:var(--green)}
  .q.bench{color:var(--amber)} .q.out{color:var(--muted)} .q.ban{color:var(--red)}
  .qsub{color:var(--muted);font-size:15px;margin:0 0 14px}
  .vbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vb{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:15px 10px;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
  .vb.yes{background:var(--green);border-color:var(--green);color:#fff}
  .vb.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .vb.yes.sel{background:var(--green2);border-color:var(--green2)}
  .vb:disabled{opacity:.4;cursor:not-allowed}
  .mypos{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
  .mypos b{color:var(--ink);font-weight:600}
  .textbtn{background:none;border:0;padding:0;font-size:14px;color:var(--green);font-weight:600;text-decoration:none;cursor:pointer}
  .textbtn.red{color:var(--red)}

  .sec{margin-top:28px}
  .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 8px}
  .sh h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;color:var(--ink)}
  .sh .n{font-size:14px;color:var(--muted);font-weight:500}
  .h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,10vw,48px);line-height:1;margin:18px 0 6px;color:var(--green)}
  .list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:48px;background:var(--card)}
  .list > .li:first-child{border-top:0}
  a.li{text-decoration:none}
  .li .no{font-size:14px;font-weight:600;color:var(--faint);width:24px;flex:none}
  .li .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .tm{font-size:13px;color:var(--faint);flex:none}
  .li.empty .nm{color:var(--faint);font-weight:400}
  .li.mine{background:var(--mine)}
  .li.menu{background:#fafcf8;flex-wrap:wrap;gap:8px}
  .bench .no{color:var(--amber)}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:1px;background:var(--mine);color:var(--green)}
  .tag.red{background:#fbe3de;color:var(--red)}
  .tag.y{background:var(--yellow);color:var(--yellow-ink)}
  .pos{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.3px;flex:none}
  .x{background:none;border:0;cursor:pointer;color:var(--faint);font-size:20px;line-height:1;padding:2px 4px}
  .outs{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 14px;color:var(--muted);font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .outs span{text-decoration:line-through;text-decoration-color:var(--faint)}
  .hint{color:var(--muted);font-size:14px;margin:10px 2px 0;line-height:1.45}
  .chev{color:var(--faint);font-size:18px}
  .sub2{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
  .nm a,.king a,.mvp a,.ns a,.hint a{text-decoration:none} .hint a{color:var(--green);font-weight:600}

  .pp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .pc{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;color:var(--ink)}
  .pc.on{border-color:var(--green);background:var(--green);color:#fff}
  .pc b{background:var(--yellow);color:var(--yellow-ink);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px}
  @media (max-width:420px){ .pc{font-size:13px} .mark span{display:none} }

  .teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .team{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .team .th{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:var(--teal);color:#fff}
  .team.b .th{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
  .team .th b{font-family:var(--display);font-weight:700;font-size:22px}
  .team .th span{font-size:13px;font-weight:500;opacity:.85}
  .line{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line)}
  .line:first-of-type{border-top:0}
  .line .ab{font-size:12px;font-weight:700;color:var(--green2);width:22px;flex:none;padding-top:2px}
  .line .ns{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .line .ns span{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .ns sup{font-size:10px;color:var(--amber);margin-left:3px;font-weight:700}
  .line .ns .rot{color:var(--muted);font-weight:400;font-style:italic}
  .line .ns em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
  .tnote{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--mine);color:var(--green)}
  .badge.y{background:var(--yellow);color:var(--yellow-ink)}

  .score .circle,.king .circle{opacity:.45}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 16px;margin-top:10px;text-align:center}
  .score .t{font-family:var(--display);font-weight:700;font-size:24px}
  .score .t.a{color:#7ff0e4}
  .score .s{font-family:var(--display);font-weight:700;font-size:54px;padding:0 10px;line-height:1}
  .score .sub{grid-column:1/-1;font-size:14px;margin-top:8px;opacity:.95}
  .mvp{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--yellow);color:var(--yellow-ink);border-radius:var(--r);padding:14px 16px;margin-top:10px}
  .mvp small{font-size:13px;font-weight:600}
  .mvp b{font-family:var(--display);font-weight:700;font-size:26px}

  .king{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding:20px 22px;margin-top:10px}
  .king.dark{background:var(--yellow);color:var(--yellow-ink)}
  .king small{font-size:13px;font-weight:600;opacity:.95}
  .king .who{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1;margin-top:4px;word-break:break-word}
  .king .g{font-family:var(--display);font-weight:700;font-size:52px;line-height:.9;text-align:right}
  .king .g span{display:block;font-size:13px;font-weight:600}
  .seg{display:flex;background:#e8efe4;border-radius:10px;padding:3px;margin:18px 0 10px;gap:3px}
  .seg button{flex:1;background:none;border:0;padding:9px 4px;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 2px rgba(22,48,31,.12)}
  .tblw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table.tbl{width:100%;border-collapse:collapse}
  .tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);background:#fafcf8}
  .tbl th:nth-child(2){text-align:left}
  .tbl td{padding:11px 8px;border-top:1px solid var(--line);text-align:right;font-size:15px}
  .tbl tr:first-child td{border-top:0}
  .tbl td:first-child{color:var(--faint);width:30px;text-align:left;font-weight:600}
  .tbl td:nth-child(2){text-align:left;font-weight:500;max-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl td:nth-child(2) a{text-decoration:none}
  .tbl td.hl{font-weight:700;color:var(--green)}
  .tbl tr.mine td{background:var(--mine)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
  .grid div{background:var(--card);padding:14px 12px}
  .grid b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1;color:var(--green)}
  .grid small{font-size:12px;font-weight:600;color:var(--muted)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:0}
  .panel h3{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink)}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fg .full{grid-column:1/-1}
  label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:10px}
  .fg label.f{margin-bottom:0}
  label.f span{display:block;margin-bottom:5px}
  label.f em{font-style:normal;color:var(--faint);font-weight:400}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],input[inputmode],select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(47,138,76,.15)}
  .pin{letter-spacing:8px;font-size:22px!important;text-align:center}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 15px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
  .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
  .btn.lime{background:#25d366;border-color:#25d366;color:#fff}
  .btn.danger{border-color:#f0c2b8;color:var(--red)}
  .btn.full{width:100%;padding:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .inline{display:flex;gap:8px}
  .inline input,.inline select{flex:1;min-width:0}
  .res .li{gap:8px 10px;flex-wrap:wrap}
  .res .li .nm{flex:1 1 calc(100% - 40px)}
  .res .li .tsw{margin-left:30px}
  .res .li.off .nm{color:var(--faint);text-decoration:line-through}
  .step{display:flex;align-items:center;gap:3px}
  .step b{display:inline-block;min-width:22px;text-align:center;font-weight:700}
  .step button{width:32px;height:32px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink)}
  .step small{font-size:12px;color:var(--faint);font-weight:700;margin-right:2px}
  .tsw{border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;background:#fff;min-width:64px;color:var(--muted)}
  .tsw.A{background:var(--teal);border-color:var(--teal);color:#fff} .tsw.B{background:#fff;border-color:var(--ink);color:var(--ink)}
  .tag.ta{background:#d5f5f2;color:#0b6e68}
  .chk{width:22px;height:22px;accent-color:var(--green);flex:none}
  .ed select{width:auto;padding:7px 8px;font-size:14px;border-radius:8px}

  /* MVP oylama */
  .ballot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .ballot .bh{padding:14px 16px;background:var(--yellow);color:var(--yellow-ink)}
  .ballot .bh b{font-family:var(--display);font-size:22px;font-weight:700;display:block}
  .ballot .bh small{font-size:14px}
  .opt{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:16px}
  .opt:first-of-type{border-top:0}
  .opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
  .opt.sel .rad{border:7px solid var(--green)}
  .opt[disabled]{color:var(--faint);cursor:not-allowed}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--green2)}

  /* giriş */
  .auth{max-width:420px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}
  .auth .hero{padding:26px 20px 22px;text-align:center;margin-bottom:22px}
  .auth .hero b{font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:6px;line-height:1;display:block}
  .auth .hero small{font-size:15px;opacity:.95}
  .auth .seg{margin:0 0 16px}
  .err{color:var(--red);font-size:15px;margin:10px 0 0;min-height:1em}
  .demo-note{font-size:13px;color:var(--muted);border:1.5px dashed var(--line);padding:10px 12px;border-radius:10px;margin-top:22px;line-height:1.6}

  .notice{padding:44px 8px;text-align:center;color:var(--muted)}
  .notice b{display:block;color:var(--green);font-family:var(--display);font-size:28px;font-weight:700;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:#fff;font-size:15px;font-weight:500;padding:11px 16px;border-radius:12px;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .mtabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .mtab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;text-align:left;cursor:pointer;min-width:118px;color:var(--ink)}
  .mtab b{display:block;font-family:var(--display);font-size:19px;color:var(--green);font-weight:700}
  .mtab small{font-size:13px;color:var(--muted)}
  .mtab.on{border-color:var(--green2);background:var(--mine)}
  .why{display:block;font-size:12px;color:var(--amber);font-weight:600;margin-top:1px}
  .codebox{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:6px;color:var(--green);text-align:center;background:#fff;border-radius:12px;padding:10px;margin:6px 0}
  .ed .li.off .nm{color:var(--faint)}
  .btn svg{width:16px;height:16px}
  .ed select:disabled{opacity:.4}

  /* sade arayüz */
  .me-btn{gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;color:var(--green);font-weight:600;font-size:14px}
  .me-btn i{width:30px;height:30px;font-size:14px}
  .posrow .mypos{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .posrow .pp{margin-top:14px}
  .line{flex-direction:column;gap:3px}
  .line .ab{width:auto;padding:0;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .meta b{color:var(--ink)}

  /* FARK logosu */
  :root{--navy:#24496a}
  .brand{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--navy);background:linear-gradient(180deg,#4677a3,#1c3d5a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .mark{gap:9px;align-items:center}
  .mark svg{height:34px;width:auto;display:block}
  .mark span{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:13px;letter-spacing:2.5px;color:var(--navy);background:linear-gradient(180deg,#4677a3,#1c3d5a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-top:6px}

<body>
<div id="root"><div class="notice">Yükleniyor…</div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   AYARLAR — Firebase kurulumundan sonra burayı doldur.
   Boş bırakılırsa site DEMO modunda (sahte verilerle) açılır.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDvc3de0JJV7HsTdmCZo-irfv7-lEVdDh8",
  authDomain: "fark-halisaha.firebaseapp.com",
  projectId: "fark-halisaha",
  appId: "1:156629277422:web:ae1e50be5e36fbe6b671ff"
};
const MASTER_NAME = "derinfark";            // ana admin hesabının sitede görünen adı
const DOMAIN = "farkhalisaha.app";          // giriş e-postaları için sahte alan adı (değiştirme)
const pinToPassword = (no, pin) => `fhs-${pin}-${no}`;
const RESET_MINUTES = 15;                   // şifre sıfırlama kodunun geçerlilik süresi

const CONFIGURED = !!firebaseConfig.apiKey;
const OFFLINE = "Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.";
const QUOTA = "Sitenin bugünkü ücretsiz kullanım sınırı doldu. Her gün 10.00-11.00 arasında sıfırlanır, sonra tekrar dene.";
let quotaHit = false;
const DEMO = !CONFIGURED && typeof demoApi === "function";
const NAME_RE = /^[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû .'-]{5,40}$/;
const TS_KEYS = ["startAt", "voteFrom", "voteUntil", "until", "createdAt", "banUntil"];
// Otomatik kilit: 10 dakikada en fazla 30 değişiklik; aşan hesap 24 saat kilitlenir (sunucu kuralı da aynısı)
const ACT_MAX = 30, ACT_WIN = 10 * 60000, ACT_LOCK = 24 * 3600000, ACT_WARN = 20;

/* =========================================================
   VERİ KATMANI — Firebase
   Koleksiyonlar: players, logins, admins, matches, signups, ballots, results, resets, claims
   ========================================================= */
async function firebaseApi(){
  const base = "https://www.gstatic.com/firebasejs/10.14.1/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const A = await import(base + "firebase-auth.js");
  const F = await import(base + "firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  // Telefonda yerel önbellek: kısa sürede tekrar açılınca veriler baştan okunmaz (kota tasarrufu)
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch(_){ db = F.getFirestore(app); }
  const d = (...p) => F.doc(db, ...p), col = n => F.collection(db, n);
  const ms = v => v && v.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);
  const fixTs = o => { for (const k of TS_KEYS.concat(["at"])) if (o[k] && o[k].toMillis) o[k] = o[k].toMillis(); return o; };
  const rows = s => s.docs.map(x => fixTs({ id: x.id, ...x.data({ serverTimestamps: "estimate" }) }));
  const tsIn = o => { const r = { ...o }; for (const k of TS_KEYS) if (typeof r[k] === "number") r[k] = F.Timestamp.fromMillis(r[k]); return r; };
  const noFromEmail = e => String(e || "").split("@")[0].split(".")[0];
  let busyAuth = false, authCb = null, unsubs = [], actUnsubs = [], actKey = null, cbRef = null;
  // --- canlı veri + yıllık arşiv birleştirme
  let live = { m: {}, r: {} }, hist = {}, got = { m: false, h: false, r: false };
  const rawM = id => live.m[id] || (hist[id] && hist[id].m) || null;
  const rawR = id => live.r[id] || (hist[id] && hist[id].r) || null;
  function emitMR(){
    if (!cbRef || !got.m || !got.h) return;
    const M = { ...Object.fromEntries(Object.entries(hist).map(([k, e]) => [k, e.m])), ...live.m };
    cbRef("matches", Object.entries(M).map(([id, x]) => fixTs({ id, ...x })));
    if (!got.r) return;
    const Rs = {}; for (const [k, e] of Object.entries(hist)) if (e.r && !live.m[k]) Rs[k] = e.r;
    Object.assign(Rs, live.r);
    cbRef("results", Object.entries(Rs).map(([id, x]) => fixTs({ id, ...x })));
  }
  const yearOf = m => "y" + (/^\d{4}/.test(String(m && m.date)) ? String(m.date).slice(0, 4) : "0000");
  function histPut(b, id, m, r){ b.set(d("hist", yearOf(m)), { [id]: { m, r: r || null }, _k: id }, { mergeFields: [new F.FieldPath(id), "_k"] }); }
  function histIf(b, id, r){ const m = rawM(id); if (m && m.archived) histPut(b, id, m, r); }
  // --- oyuncu belgesi ve dizin girişi birlikte yazılır (kurallar ikisinin aynı olmasını şart koşar)
  function dirPut(b, no, e){ b.set(d("dir", "d" + no.slice(-1)), { [no]: e, _k: no }, { mergeFields: [new F.FieldPath(no), "_k"] }); }
  async function playerWrite(no, patch){
    const cur = await F.getDoc(d("players", no)); if (!cur.exists()) throw new Error("Oyuncu bulunamadı.");
    if (typeof patch.banUntil === "number") patch = { ...patch, banUntil: F.Timestamp.fromMillis(patch.banUntil) };
    const x = { ...cur.data(), ...patch };
    const e = { n: x.name, p: x.pos, b: !!x.banned, u: x.uid, c: x.createdAt }; if (x.banUntil != null) e.x = x.banUntil;
    // kendi mevkisini değiştiren oyuncu sayaçla yazar; admin işlemleri ve şifre sıfırlama sayaçsız
    const own = Object.keys(patch).every(k => k === "pos");
    const fill = b => { b.update(d("players", no), patch); dirPut(b, no, e); };
    if (own) await withAct(no, fill); else { const b = F.writeBatch(db); fill(b); await b.commit(); }
  }
  // Oyuncunun kendi işlemi: işlem + sayaç (act/<no>) aynı toplu yazımda gider; kural ikisini birlikte ister
  let locksOn = false;
  const actRow = x => { const a = x.data(); return { id: x.id, w: a.w && a.w.toMillis ? a.w.toMillis() : 0, n: a.n | 0, l: !!a.l }; };
  const myNo = () => auth.currentUser ? noFromEmail(auth.currentUser.email) : null;
  async function withAct(no, fill){
    if (no !== myNo()) { const b = F.writeBatch(db); fill(b); return b.commit(); }
    const snap = await F.getDoc(d("act", no)), r = snap.exists() ? snap.data() : null;
    const ts = F.serverTimestamp(), fresh = { w: ts, n: 1, l: false, t: ts };
    const w0 = r && r.w && r.w.toMillis ? r.w.toMillis() : 0, now = Date.now();
    const cont = r && !r.l ? { w: r.w, n: (r.n | 0) + 1, l: (r.n | 0) + 1 >= ACT_MAX, t: ts } : null;
    if (r && r.l && now < w0 + ACT_LOCK - 60000) throw Object.assign(new Error(), { code: "permission-denied", locked: true });
    const first = !r ? fresh : (cont && now < w0 + ACT_WIN ? cont : fresh), second = first === fresh ? cont : fresh;
    const go = v => { const b = F.writeBatch(db); fill(b); if (!r) b.set(d("act", no), v); else b.update(d("act", no), v); return b.commit(); };
    // telefon saati sunucudan biraz farklıysa pencere sınırında bir kez öbür seçenekle dene
    try { await go(first); } catch(e){ if (second && String(e.code || "").includes("permission")) await go(second); else throw e; }
  }
  const quota = e => { if (e && String(e.code || "").includes("resource-exhausted")) quotaHit = true; };

  async function session(u){
    const no = noFromEmail(u.email);
    const p = await F.getDoc(d("players", no)).catch(() => null);
    if (p && p.exists() && p.data().uid === u.uid) return { uid: u.uid, no, master: false };
    // oyuncu kaydı yok: ana admin hesabı mı? (sunucu kuralı UID'ye bakar)
    try { await F.setDoc(d("admins", u.uid), { no: "", name: MASTER_NAME, master: true }, { merge: true }); return { uid: u.uid, no: null, master: true }; }
    catch(e){ return { uid: u.uid, no, orphan: true }; }
  }
  const authErr = e => {
    const c = e && e.code || "";
    if (c.includes("too-many-requests")) return "Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar dene. Okul internetindeysen mobil veriyle dene.";
    if (c.includes("resource-exhausted") || c.includes("quota")) return QUOTA;
    if (c.includes("network") || c.includes("unavailable")) return OFFLINE;
    return null;
  };
  async function withNewAccount(no, pin, steps){
    const email = `${no}.${Date.now().toString(36)}@${DOMAIN}`;
    busyAuth = true;
    let cred = null;
    try {
      cred = await A.createUserWithEmailAndPassword(auth, email, pinToPassword(no, pin));
      await steps(cred.user.uid, email);
    } catch(e){
      busyAuth = false;
      if (cred) { try { await cred.user.delete(); } catch(_){} }
      throw e;
    }
    busyAuth = false;
    authCb && authCb(await session(auth.currentUser));
  }

  return {
    onAuth(cb){ authCb = cb; A.onAuthStateChanged(auth, async u => { if (busyAuth) return; cb(u ? await session(u) : null); }); },
    async login(no, pin){
      let L; try { L = await F.getDoc(d("logins", no)); } catch(e){ throw new Error(authErr(e) || OFFLINE); }
      const email = L.exists() ? L.data().email : `${no}@${DOMAIN}`;
      try { await A.signInWithEmailAndPassword(auth, email, pinToPassword(no, pin)); }
      catch(e){ throw new Error(authErr(e) || (L.exists() ? "Şifre yanlış." : "Bu numarayla kayıt yok. Önce kayıt ol.")); }
    },
    async register({ no, name, pos, pin }){
      let L; try { L = await F.getDoc(d("logins", no)); } catch(e){ throw new Error(authErr(e) || OFFLINE); }
      if (L.exists()) throw new Error("Bu numara zaten kayıtlı. Giriş yap.");
      try {
        await withNewAccount(no, pin, async (uid, email) => {
          await F.setDoc(d("logins", no), { email, uid });
          const b = F.writeBatch(db), ts = F.serverTimestamp();
          b.set(d("players", no), { name, pos, uid, banned: false, createdAt: ts });
          dirPut(b, no, { n: name, p: pos, b: false, u: uid, c: ts });
          await b.commit();
        });
      } catch(e){ throw new Error(authErr(e) || "Kayıt tamamlanamadı, tekrar dene."); }
    },
    async recover({ no, code, pin }){
      let L; try { L = await F.getDoc(d("logins", no)); } catch(e){ throw new Error(authErr(e) || OFFLINE); }
      if (!L.exists()) throw new Error("Bu numarayla kayıt yok.");
      try {
        await withNewAccount(no, pin, async (uid, email) => {
          await F.setDoc(d("claims", no), { code, uid, at: F.serverTimestamp() });
          await F.updateDoc(d("logins", no), { email, uid });
          await playerWrite(no, { uid });
        });
      } catch(e){ throw new Error(authErr(e) || "Kod yanlış, kullanılmış ya da süresi dolmuş. Adminden yeni kod iste."); }
    },
    async logout(){ locksOn = false; unsubs.concat(actUnsubs).forEach(u => u()); unsubs = []; actUnsubs = []; actKey = null; live = { m: {}, r: {} }; hist = {}; got = { m: false, h: false, r: false }; await A.signOut(auth); },
    markPw: () => F.setDoc(d("admins", auth.currentUser.uid), { pwOk: true }, { merge: true }),
    async changePin(oldPin, newPin){
      const u = auth.currentUser, no = noFromEmail(u.email);
      try { await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, pinToPassword(no, oldPin))); }
      catch(e){ throw new Error(authErr(e) || "Mevcut şifre yanlış."); }
      await A.updatePassword(u, pinToPassword(no, newPin));
    },
    subscribe(cb){
      cbRef = cb;
      const on = (ref, kind, fn) => unsubs.push(F.onSnapshot(ref, fn, e => { cb(kind + ":error"); quota(e); }));
      // Oyuncu listesi: 2000 oyuncu bile 10 belgede (dir/d0..d9) → açılışta 10 okuma
      on(col("dir"), "players", s => {
        const out = [];
        s.docs.forEach(x => { const sh = x.id.slice(1), data = x.data({ serverTimestamps: "estimate" });
          for (const [no, e] of Object.entries(data)) if (/^[0-9]{8}$/.test(no) && no.endsWith(sh) && e && typeof e === "object")
            out.push({ id: no, name: e.n, pos: e.p, banned: e.b, uid: e.u, createdAt: e.c && e.c.toMillis ? e.c.toMillis() : 0, banUntil: e.x && e.x.toMillis ? e.x.toMillis() : 0 }); });
        cb("players", out);
      });
      on(col("admins"), "admins", s => cb("admins", rows(s)));
      // kendi kilit sayacı (1 okuma); adminler ayrıca kilitli hesapları görür
      const me = myNo();
      if (me && /^[0-9]{8}$/.test(me)) unsubs.push(F.onSnapshot(d("act", me), x => cb("act", x.exists() ? actRow(x) : null), () => {}));
      // Sadece bu haftanın maçları canlı okunur; geçmiş maçlar yıllık özet belgelerinden (hist/y2026...) gelir
      on(F.query(col("matches"), F.where("archived", "==", false)), "matches", s => { live.m = {}; s.docs.forEach(x => live.m[x.id] = x.data({ serverTimestamps: "estimate" })); got.m = true; emitMR(); });
      on(col("hist"), "matches", s => { hist = {}; s.docs.forEach(x => { for (const [k, e] of Object.entries(x.data())) if (k !== "_k" && e && e.m) hist[k] = e; }); got.h = true; emitMR(); });
    },
    // sadece adminler: kilitli hesaplar (yalnızca kilitli olanlar okunur)
    watchLocks(){
      if (locksOn) return; locksOn = true;
      unsubs.push(F.onSnapshot(F.query(col("act"), F.where("l", "==", true)), x => cbRef("locks", x.docs.map(actRow)), () => { locksOn = false; cbRef("locks", []); }));
    },
    // Sadece aktif maçların kayıtları ve oyları okunur (ücretsiz okuma kotasını korumak için)
    setActive(ids){
      const key = ids.slice().sort().join(",");
      if (key === actKey) return; actKey = key;
      actUnsubs.forEach(u => u()); actUnsubs = [];
      live.r = {}; got.r = !ids.length;
      if (!ids.length){ cbRef("signups", []); cbRef("ballots", []); emitMR(); return; }
      for (const kind of ["signups", "ballots"]){
        const q = F.query(col(kind), F.where("matchId", "in", ids.slice(0, 10)));
        actUnsubs.push(F.onSnapshot(q, s => cbRef(kind, rows(s)), e => { cbRef(kind + ":error"); quota(e); }));
      }
      const rq = F.query(col("results"), F.where(F.documentId(), "in", ids.slice(0, 10)));
      actUnsubs.push(F.onSnapshot(rq, s => { live.r = {}; s.docs.forEach(x => live.r[x.id] = x.data()); got.r = true; emitMR(); }, e => { cbRef("results:error"); quota(e); }));
    },
    signup: (mid, no, status, pos) => withAct(no, b => b.set(d("signups", mid + "_" + no), { matchId: mid, who: no, status, pos, at: F.serverTimestamp() })),
    signupPos: (mid, who, pos) => withAct(who, b => b.update(d("signups", mid + "_" + who), { pos })),
    deleteSignup: (mid, who) => withAct(who, b => b.delete(d("signups", mid + "_" + who))),
    unlock: no => F.setDoc(d("act", no), { w: F.Timestamp.fromMillis(0), n: 0, l: false, t: F.Timestamp.fromMillis(0) }),
    addGuest: (mid, name, pos) => { const who = "g-" + Date.now().toString(36); return F.setDoc(d("signups", mid + "_" + who), { matchId: mid, who, guest: true, name, status: "in", pos, at: F.serverTimestamp() }); },
    createMatch: m => F.setDoc(d("matches", m.id), tsIn(m)),
    updateMatch: (mid, p) => F.updateDoc(d("matches", mid), tsIn(p)),
    async deleteMatch(mid, whos){ const b = F.writeBatch(db); whos.forEach(w => b.delete(d("signups", mid + "_" + w))); b.delete(d("matches", mid)); await b.commit(); },
    async archive(items){
      const b = F.writeBatch(db);
      items.forEach(it => {
        b.update(d("matches", it.id), { archived: true, open: false });
        if (it.result) b.update(d("results", it.id), it.result);
        const m = rawM(it.id), r = rawR(it.id);
        if (m) histPut(b, it.id, { ...m, archived: true, open: false }, r ? { ...r, ...(it.result || {}) } : null);
      });
      await b.commit();
    },
    castBallot: (mid, voter, pick, pickKey, pickName) => withAct(voter, b => b.set(d("ballots", mid + "_" + voter), { matchId: mid, voter, pick, pickKey, pickName, at: F.serverTimestamp() })),
    async saveResult(r){ const b = F.writeBatch(db); b.set(d("results", r.matchId), r); histIf(b, r.matchId, r); await b.commit(); },
    async patchResult(id, p){ const b = F.writeBatch(db); b.update(d("results", id), p); histIf(b, id, { ...(rawR(id) || {}), ...p }); await b.commit(); },
    async deleteResult(id){ const b = F.writeBatch(db); b.delete(d("results", id)); histIf(b, id, null); await b.commit(); },
    updatePlayer: (no, p) => playerWrite(no, p),
    deletePlayer: async no => { const b = F.writeBatch(db); b.delete(d("players", no)); b.set(d("dir", "d" + no.slice(-1)), { [no]: F.deleteField(), _k: no }, { merge: true }); await b.commit(); await F.deleteDoc(d("logins", no)).catch(() => {}); },
    async issueReset(no, code, until){ const b = F.writeBatch(db); b.set(d("resets", no), { code, until: F.Timestamp.fromMillis(until) }); b.delete(d("claims", no)); await b.commit(); },
    addAdmin: (uid, no) => F.setDoc(d("admins", uid), { no, master: false }),
    removeAdmin: uid => F.deleteDoc(d("admins", uid)),
  };
}

/* =========================================================
   VERİ KATMANI — DEMO (sahte veri, sadece bu tarayıcıda)
   ========================================================= */


/* =========================================================
   UYGULAMA
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const POS = { FV: "Forvet", OS: "Orta saha", DF: "Defans", KL: "Kaleci" };
/* ---------- arama: büyük/küçük harf, Türkçe/İngilizce harf farkı gözetmez ---------- */
const FOLD = { "ı":"i", "ş":"s", "ğ":"g", "ü":"u", "ö":"o", "ç":"c", "â":"a", "î":"i", "û":"u" };
const fold = t => String(t || "").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ışğüöçâîû]/g, c => FOLD[c]).replace(/\s+/g, " ").trim();
const srch = { oyuncular: "", istatistik: "", veriler: "", maclar: "" };
const sKey = (name, no) => fold(name) + (isAdmin() && no ? " " + no : "");
const sHit = (key, q) => { const w = fold(q).split(" ").filter(Boolean); return !w.length || w.every(x => key.includes(x)); };

const sBox = (k, ph) => `<label class="srch">${ICON.search}<input type="search" data-srch="${k}" value="${esc(srch[k])}" placeholder="${ph}" autocomplete="off" enterkeyhint="search"></label>`;
// Uzun listeler: arama hepsini tarar ama ekrana ilk 50 satır çizilir (2000 oyuncuda bile hızlı açılır)
const PAGE = 50, lists = {}, lim = {};
const sFilt = k => (lists[k] || []).filter(it => sHit(it.key, srch[k]));
const sRows = k => sFilt(k).slice(0, lim[k] || PAGE).map(it => it.row()).join("");
function sFoot(k){
  const n = sFilt(k).length, shown = Math.min(n, lim[k] || PAGE);
  if (!n) return `<p class="hint">Sonuç yok.</p>`;
  return n > shown ? `<button class="btn more" data-act="more" data-k="${k}">Daha fazla göster (${n - shown} ${k === "maclar" ? "maç" : "kişi"} daha)</button>` : "";
}
const sList = (k, items) => { lists[k] = items; return ""; };
function applySearch(k, keep){
  if (!keep) lim[k] = PAGE;
  const a = document.getElementById("sl-" + k), f = document.getElementById("sf-" + k);
  if (a) a.innerHTML = sRows(k); if (f) f.innerHTML = sFoot(k);
}

const mDate = m => { if (!m || !m.date) return null; const d = new Date(m.date + "T" + (m.time || "20:00")); return isNaN(d) ? null : d; };

// Türkiye saati (UTC+3, yaz saati yok). Oylama maç bitince açılır, başlangıçtan 24 saat sonra kapanır.
function windowOf(date, time, duration){
  const t = Date.parse((date || "") + "T" + (time || "20:00") + ":00+03:00");
  if (!Number.isFinite(t)) return { startAt: 0, voteFrom: 0, voteUntil: 0 };
  return { startAt: t, voteFrom: t + (Number(duration) || 60) * 60000, voteUntil: t + 24 * 3600000 };
}
const mById = id => matches.find(m => m.id === id) || null;
const voteState = m => { if (!m || !m.voteFrom) return "none"; const n = Date.now(); return n < m.voteFrom ? "before" : n < m.voteUntil ? "open" : "closed"; };
const fmtWhenMs = ms => { const d = new Date(ms); return d.toLocaleDateString("tr-TR", { weekday: "long" }) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const activeMatches = () => matches.filter(m => !m.archived).sort((a, b) => (a.startAt - b.startAt) || (a.createdAt - b.createdAt));
const isLive = id => { const m = mById(id); return !!m && !m.archived; };
function tallyLive(mid){
  const c = {};
  ballots.filter(b => b.matchId === mid && b.pickKey && b.pickKey !== b.voter).forEach(b => { const x = c[b.pickKey] ||= { key: b.pickKey, name: b.pickName, n: 0 }; x.n++; });
  return Object.values(c).sort((a, b) => b.n - a.n);
}
const tallyOf = r => isLive(r.matchId) ? tallyLive(r.matchId) : (r.mvpTally || []);
// Oylamanın kazananı: en çok oy; eşitlikte o maçta daha çok gol atan; o da eşitse karar admine kalır
function winnerOf(t, playersOfMatch){
  if (!t.length) return null;
  const top = t.filter(x => x.n === t[0].n);
  if (top.length === 1) return top[0].key;
  const g = k => { const p = (playersOfMatch || []).find(q => q.key === k); return p ? p.goals : 0; };
  top.sort((a, b) => g(b.key) - g(a.key));
  return g(top[0].key) > g(top[1].key) ? top[0].key : null;
}
const voteOpenFor = id => { const m = mById(id); return !!m && !m.archived && voteState(m) !== "closed"; };
const effMotm = r => r.motm || (voteOpenFor(r.matchId) ? "" : (isLive(r.matchId) ? (winnerOf(tallyLive(r.matchId), r.players) || "") : (r.mvpWinner || "")));

/* ---------- kadro, yedek, öncelik ----------
   - Her maçta ilk "Geliyorum" diyenler öne geçer.
   - Bu haftanın (aktif) DAHA ÖNCEKİ bir maçının as kadrosunda olan kayıtlı oyuncu, bu maçta
     bu hafta oynamayanların arkasına geçer (öncelik oynamayanlarda).
   - Admin kaydı kapatınca sıra o andaki haliyle sabitlenir (frozen).
   - Admin kadroyu elle kurduysa (squad) o geçerlidir; çekilen olursa yerine sıradaki yedek girer.
   - Misafirler önceliğe dahil değildir; sıraya eklendikleri zamana göre girerler. */
let _lc = null;   // önbellek: veri dizileri her anlık görüntüde yeniden oluşturulduğu için referans karşılaştırması yeterli
function lineups(){
  const no = sess && sess.no;
  if (_lc && _lc.s === signups && _lc.m === matches && _lc.no === no) return _lc.out;
  const out = {}, busySet = new Map();
  for (const m of activeMatches()){
    const cap = m.capacity || 12;
    const sg = signups.filter(s => s.matchId === m.id);
    const ins = sg.filter(s => s.status === "in").sort((a, b) => (a.at - b.at) || a.id.localeCompare(b.id));
    const isBusy = s => !s.guest && busySet.has(s.id);
    let order;
    if (!m.open && m.frozen.length){
      const ix = new Map(m.frozen.map((id, i) => [id, i]));
      order = ins.filter(s => ix.has(s.id)).sort((a, b) => ix.get(a.id) - ix.get(b.id)).concat(ins.filter(s => !ix.has(s.id)));
    } else order = ins.filter(s => !isBusy(s)).concat(ins.filter(isBusy));
    let kadro, yedek;
    if (m.squad.length){
      const sq = new Set(m.squad);
      kadro = order.filter(s => sq.has(s.id));
      const rest = order.filter(s => !sq.has(s.id));
      while (kadro.length < cap && rest.length) kadro.push(rest.shift());
      yedek = rest;
    } else { kadro = order.slice(0, cap); yedek = order.slice(cap); }
    const why = {};
    yedek.forEach(s => { if (isBusy(s)) why[s.id] = busySet.get(s.id); });
    kadro.forEach(s => { if (!s.guest && !busySet.has(s.id)) busySet.set(s.id, m.label); });
    out[m.id] = { m, cap, kadro, yedek, outs: sg.filter(s => s.status === "out"), why, mine: sess && sess.no ? sg.find(s => s.id === sess.no) : null };
  }
  _lc = { s: signups, m: matches, no, out };
  return out;
}
const derive = mid => lineups()[mid] || { m: mById(mid), cap: 12, kadro: [], yedek: [], outs: [], why: {}, mine: null };

function teamScore(r){
  const s = { A: 0, B: 0 }; let has = false;
  (r.players || []).forEach(p => { if (p.played && (p.team === "A" || p.team === "B")){ has = true; s[p.team] += Number(p.goals) || 0; } });
  return has ? s : null;
}
// Takım bazında: bir takımın toplam asisti, o takımın toplam golünü geçemez
function assistProblem(rows, names){
  const g = {}, a = {};
  rows.filter(r => r.played).forEach(r => { const t = r.team || "?"; g[t] = (g[t] || 0) + (r.goals | 0); a[t] = (a[t] || 0) + (r.assists | 0); });
  const bad = Object.keys(a).find(t => a[t] > (g[t] || 0));
  return bad ? (bad === "?" ? "Takımsız oyuncular" : tName(names, bad)) : null;
}
let aggCache = null, aggOf = null;
function aggregate(){
  if (aggOf === results && aggCache) return aggCache;
  const agg = {};
  const rs = results.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  for (const r of rs){
    const sc = teamScore(r), mv = effMotm(r);
    for (const p of (r.players || [])){
      if (!p.played) continue;
      const a = agg[p.key] ||= { key: p.key, no: p.no || null, name: p.name || "", m: 0, g: 0, a: 0, mvp: 0, w: 0, d: 0, l: 0 };
      a.m++; a.g += Number(p.goals) || 0; a.a += Number(p.assists) || 0;
      if (p.name) a.name = p.name;
      if (mv === p.key) a.mvp++;
      if (sc && (p.team === "A" || p.team === "B")){ const o = p.team === "A" ? "B" : "A"; if (sc[p.team] > sc[o]) a.w++; else if (sc[p.team] < sc[o]) a.l++; else a.d++; }
    }
  }
  aggOf = results; aggCache = agg;
  return agg;
}
const aName = a => a.no ? (players[a.no] ? players[a.no].name : a.name || "Oyuncu") : (a.name || "Misafir");

/* ---------- takım önerisi ---------- */
function rng(seed){ let h = 1779033703; for (const c of String(seed)){ h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function formation(n){ const fv = Math.max(1, Math.round(n * 0.2)), df = Math.floor((n - fv) / 2); return { DF: df, OS: n - fv - df, FV: fv }; }
const emptyTeams = () => [0, 1].map(t => ({ id: t ? "B" : "A", lines: { FV: [], OS: [], DF: [], KL: [] }, tot: 0 }));
function autoTeams(kadro, size, m, stats){
  const R = rng(m.teamSeed || m.id);
  const P = kadro.map(v => { const s = stats[vKey(v)], pp = validPos(v.pos); return { v, pos: pp.length ? pp : ["OS","DF","FV"], r: s && s.m ? (s.g + 0.5 * s.a + 0.5 * s.mvp) / s.m : 0, rnd: R() }; });
  const gk = [];
  for (let rank = 0; rank < 3 && gk.length < 2; rank++) for (const p of P){ if (gk.length >= 2) break; if (!gk.includes(p) && p.pos[rank] === "KL"){ p.asg = "KL"; p.rank = rank; gk.push(p); } }
  if (R() < .5) gk.reverse();
  const teams = emptyTeams();
  teams.forEach((t, i) => { t.gk = gk[i] || null; t.slots = formation(size - (gk[i] ? 1 : 0)); });
  const left = { DF: 0, OS: 0, FV: 0 }; teams.forEach(t => { for (const k in left) left[k] += t.slots[k]; });
  const rest = P.filter(p => !gk.includes(p));
  for (let rank = 0; rank < 3; rank++) for (const p of rest){ if (p.asg) continue; const k = p.pos[rank]; if (k && k !== "KL" && left[k] > 0){ p.asg = k; p.rank = rank; left[k]--; } }
  for (const p of rest){ if (p.asg) continue; const k = ["OS","DF","FV"].find(k => left[k] > 0); p.asg = k; p.rank = -1; left[k]--; }
  let flip = R() < .5;
  for (const k of ["FV","OS","DF"]){
    const grp = rest.filter(p => p.asg === k).sort((a, b) => b.r - a.r || a.rnd - b.rnd);
    for (const p of grp){
      const open = teams.filter(t => t.lines[k].length < t.slots[k]);
      const t = open.length === 1 ? open[0] : (teams[0].tot === teams[1].tot ? teams[flip ? 1 : 0] : (teams[0].tot < teams[1].tot ? teams[0] : teams[1]));
      flip = !flip; t.lines[k].push(p); t.tot += p.r;
    }
  }
  teams.forEach(t => { if (t.gk) t.lines.KL.push(t.gk); });
  return teams;
}
function buildTeams(kadro, cap, m){
  const size = Math.floor(cap / 2), lu = m.lineup || {};
  const manual = kadro.some(v => lu[v.id]);
  let teams;
  if (!manual){
    if (size < 2 || kadro.length < cap) return null;
    teams = autoTeams(kadro.slice(0, size * 2), size, m, aggregate());
  } else {
    teams = emptyTeams();
    for (const v of kadro){
      const o = lu[v.id], pp = validPos(v.pos);
      if (o){ const [tm, ps] = o.split("-"); teams.find(t => t.id === tm).lines[ps].push({ v, asg: ps, rank: pp.indexOf(ps), manual: true }); }
    }
    for (const v of kadro){ // admin düzenledikten sonra kadroya girenler: kalabalık olmayan takıma, ilk tercihine
      if (lu[v.id]) continue;
      const pp = validPos(v.pos), k = pp[0] || "OS";
      const t = teams.slice().sort((a, b) => Object.values(a.lines).flat().length - Object.values(b.lines).flat().length)[0];
      t.lines[k].push({ v, asg: k, rank: 0, manual: false, late: true });
    }
  }
  teams.forEach(t => { t.gk = t.lines.KL[0] || null; });
  teams.edited = manual;
  return teams;
}

      ${rec ? `<label class="f"><span>Sıfırlama kodu</span><input id="aCode" value="${esc(fv2.aCode || "")}" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="8 haneli kod" class="pin" style="letter-spacing:4px"></label>` : ""}
      ${reg || rec ? pinIn("aPin", reg ? "Şifre belirle (4-8 rakam)" : "Yeni şifre (4-8 rakam)", "new-password") + pinIn("aPin2", "Şifre tekrar", "new-password")
        : `<label class="f"><span>Şifre</span><input type="password" id="aPin" value="${esc(fv2.aPin || "")}" class="pin" ${eggOpen ? 'maxlength="40" style="letter-spacing:2px"' : 'inputmode="numeric" maxlength="8"'} autocomplete="current-password" placeholder="••••" required></label>`}
      <button class="btn pri full" type="submit" ${busy ? "disabled" : ""}>${busy ? "Bekle…" : reg ? "Kayıt ol" : rec ? "Şifremi yenile" : "Giriş yap"}</button>
      <p class="err">${esc(authErr)}</p>
    </form>
    ${reg ? ""
      : rec ? `<p class="hint"><a href="#" data-act="amode" data-m="login">‹ Girişe dön</a></p>`
      : `<p class="hint">Şifreni mi unuttun? Bir admine yaz, sana kod versin. Sonra <a href="#" data-act="amode" data-m="recover">Şifremi unuttum</a>'a dokun.</p>`}

}

/* ---------- bu hafta ---------- */
function matchTabs(act, cur){
  if (act.length < 2) return "";
  const L = lineups();
  return `<div class="mtabs">${act.map(m => { const x = L[m.id], mine = x && x.mine && x.mine.status === "in" ? (x.kadro.some(s => s.id === sess.no) ? " · kadrodasın" : " · yedektesin") : "";
    const d = mDate(m); return `<button class="mtab ${cur && cur.id === m.id ? "on" : ""}" data-act="selm" data-id="${esc(m.id)}"><b>${esc(m.label)}</b><small>${d ? esc(d.toLocaleDateString("tr-TR", { weekday: "short" }) + " " + m.time) : ""}${esc(mine)}</small></button>`; }).join("")}</div>`;
}
function viewWeek(){
  const adm = isAdmin(), act = activeMatches(), m = currentMatch();
  if (!m) return `<div class="notice"><b>Maç henüz açılmadı</b>${adm ? `<a href="#yonetim">Yönetim</a> sekmesinden bu haftanın maçlarını ekle.` : "Organizatör bu haftanın maçlarını açınca burada göreceksin."}</div>`;
  const { cap, kadro, yedek, outs, mine, why } = derive(m.id);
  const open = m.open, d = mDate(m), ml = mapLinks(m), cl = calLink(m);
  let h = matchTabs(act, m) + `<section class="pitch board">
    <div class="status ${open ? "" : "closed"}"><i></i>${esc(m.label)} · ${open ? "Kayıt açık" : "Kayıt kapandı"}</div>
    <div class="day">${d ? esc(dayName(d)) : "Tarih yok"}</div>
    <div class="date">${d ? esc(dateLine(d, m)) : ""}</div>
    ${m.place ? `<div class="place">${esc(m.place)}</div>` : ""}
    <div class="links">
      ${ml ? `<a class="olink lime" href="${esc(ml.dir)}" target="_blank" rel="noopener">${ICON.nav}Yol tarifi</a>` : ""}
      ${cl ? `<a class="olink" href="${esc(cl)}" target="_blank" rel="noopener">${ICON.cal}Takvime ekle</a>` : ""}
    </div></section>`;

  if (sess.no){
    const p = me(), pos = validPos(p && p.pos);
    let q = `<p class="q">Bu maça geliyor musun?</p>`;
    if (mine && mine.status === "in"){
      const ki = kadro.findIndex(v => v.id === sess.no), yi = yedek.findIndex(v => v.id === sess.no);
      q = ki >= 0 ? `<p class="q">✅ Oynuyorsun</p>`
        : `<p class="q bench">⏳ Yedektesin · ${yi + 1}. sıradasın</p>`;
    } else if (mine && mine.status === "out") q = `<p class="q out">❌ Gelmiyorsun</p>`;
    const dis = (!open || busy) ? "disabled" : "";
    const posBox = `${posOpen ? `<p style="margin:0 0 8px;font-size:14px;color:var(--muted)">En sevdiğinden başlayarak 3 mevki seç:</p>${posPicker(myPosEdit || pos, "me")}<div class="acts" style="margin:0 0 14px"><button class="btn pri" data-act="savepos">Kaydet</button><button class="btn" data-act="posclose">Vazgeç</button></div>`
        : `<div class="mypos"><span>Mevkilerin: <b>${pos.length ? pos.map(k => POS[k]).join(", ") : "seçilmedi"}</b></span><button class="textbtn" data-act="posopen">Değiştir</button></div>`}`;
    h += `<section class="vote">${q}
      <div class="vbtns">
        <button class="vb yes ${mine && mine.status === "in" ? "sel" : ""}" data-act="in" ${dis}>${mine && mine.status === "in" ? "✓ " : ""}Geliyorum</button>
        <button class="vb no ${mine && mine.status === "out" ? "sel" : ""}" data-act="out" ${dis}>Gelemiyorum</button>
      </div>
      ${mine && open ? `<div class="acts" style="margin-top:10px"><button class="textbtn" data-act="clear">Cevabımı sil</button></div>` : ""}
      
      <div class="posrow">${posBox}</div>
    </section>`;
  }

  h += viewBallot(m, kadro);
  const filled = Math.min(kadro.length, cap);
  h += `<div class="count"><div class="big">${pad(filled)}<span>/${cap}</span></div>
      <div class="meta">${cap - filled > 0 ? `<b>${cap - filled} yer boş</b>` : "<b>Kadro doldu</b>"}<br>${yedek.length} yedek · ${outs.length} gelmiyor</div></div>
    <div class="ticks" style="grid-template-columns:repeat(${cap},1fr)">${Array.from({ length: cap }, (_, i) => `<i class="${i < filled ? "on" : ""}"></i>`).join("")}</div>`;

  h += viewTeams(m, kadro, yedek, cap);
  const li = (v, label) => {
    if (rowMenu === v.id) return `<li class="li menu"><span class="nm" style="flex-basis:100%">${esc(vName(v))}</span>
      <button class="btn" data-act="remove" data-id="${esc(v.id)}">Listeden çıkar</button>
      ${!v.guest ? `<button class="btn danger" data-act="removeban" data-id="${esc(v.id)}">Çıkar ve banla</button>` : ""}
      <button class="textbtn" data-act="menu" data-id="">Vazgeç</button></li>`;
    return `<li class="li ${sess.no === v.id ? "mine" : ""}">
      <span class="no">${label}</span>
      <span class="nm">${v.guest ? esc(vName(v)) : plink(v.id, vName(v))}${sess.no === v.id ? `<span class="tag">sen</span>` : ""}${v.guest ? `<span class="tag">misafir</span>` : ""}${why[v.id] ? `<span class="why">zaten ${esc(why[v.id])} kadrosunda</span>` : ""}</span>
      ${posTag(v.pos)}${adm ? `<span class="tm">${v.at ? esc(fmtAt(v.at)) : ""}</span>` : ""}
      ${adm ? `<button class="x" title="İşlemler" data-act="menu" data-id="${esc(v.id)}">⋯</button>` : ""}</li>`;
  };
  let rows = kadro.map((v, i) => li(v, pad(i + 1))).join("");
  for (let i = kadro.length; i < cap; i++) rows += `<li class="li empty"><span class="no">${pad(i + 1)}</span><span class="nm">—</span></li>`;
  h += `<section class="sec"><div class="sh"><h2>Oynayacaklar</h2><span class="n">${kadro.length}/${cap}</span></div><ul class="list">${rows}</ul></section>`;
  h += `<section class="sec"><div class="sh"><h2>Yedekler</h2><span class="n">${yedek.length}</span></div>
    ${yedek.length ? `<ul class="list bench">${yedek.map((v, i) => li(v, "Y" + (i + 1))).join("")}</ul>` : `<p class="hint">Yedek yok.</p>`}</section>`;
  if (outs.length) h += `<section class="sec"><div class="sh"><h2>Gelmeyecekler</h2><span class="n">${outs.length}</span></div><div class="outs">${outs.map(v => `<span>${esc(vName(v))}</span>`).join("")}</div></section>`;
  if (adm) h += `<section class="sec"><div class="sh"><h2>Dışarıdan oyuncu ekle</h2></div>
    <div class="panel">
      <label class="f"><span>İsim</span><input type="text" id="gName" maxlength="40" placeholder="Kayıtlı olmayan oyuncunun adı" value="${esc(gName)}"></label>
      <label class="f" style="margin-bottom:8px"><span>Mevki tercihi (sırayla)</span></label>${posPicker(gPos, "guest")}
      <button class="btn pri" data-act="guest">${esc(m.label)} listesine ekle</button>
    </div></section>`;
  return h;
}

function viewBallot(m, kadro){
  const st = voteState(m); if (st === "none" || st === "before") return "";
  const mine = sess.no ? ballots.find(b => b.matchId === m.id && b.voter === sess.no) : null;
  const cnt = ballots.filter(b => b.matchId === m.id).length;
  if (st === "open"){
    const amIn = !!sess.no && kadro.some(v => v.id === sess.no);
    let h = `<section class="sec"><div class="ballot"><div class="bh"><b>${esc(m.label)} · maçın oyuncusunu seç</b><small>Kapanış: ${esc(fmtWhenMs(m.voteUntil))} · ${cnt} kişi oy verdi</small></div>`;
    if (!amIn) return h + `<p class="hint" style="margin:12px 16px 14px">Sadece maçta oynayanlar oy verebilir.</p></div></section>`;
    h += kadro.filter(v => v.id !== sess.no).map(v => `<button class="opt ${mine && mine.pick === v.id ? "sel" : ""}" data-act="ballot" data-id="${esc(v.id)}" ${busy ? "disabled" : ""}><span class="rad"></span><span class="nm">${esc(vName(v))}</span>${posTag(v.pos)}</button>`).join("");
    return h + `${mine ? `<p class="hint" style="margin:10px 16px 14px">Oyun kaydedildi.</p>` : `<div style="height:6px"></div>`}</div></section>`;
  }
  const res = results.find(r => r.matchId === m.id), t = tallyLive(m.id);
  if (!t.length && !(res && res.motm)) return "";
  const wk = res ? effMotm(res) : winnerOf(t, []);
  const x = t.find(q => q.key === wk);
  const nm = wk ? (wk.startsWith("n:") ? (x ? x.name : "Misafir") : pName(wk)) : "";
  return `<section class="sec">${wk ? `<${res ? `a href="#mac-${esc(m.id)}"` : "div"} class="mvp" style="text-decoration:none"><div><small>${esc(m.label)} · maçın oyuncusu</small><br><b>${esc(nm)}</b></div><small>${x && !(res && res.motm) ? x.n + " oy" : "Admin seçti"}</small></${res ? "a" : "div"}>`
    : `<p class="hint">Oylamada eşitlik çıktı, kararı admin verecek.</p>`}</section>`;
}

function viewTeams(m, kadro, yedek, cap){
  const T = buildTeams(kadro, cap, m), size = Math.floor(cap / 2), adm = isAdmin();
  let h = `<section class="sec"><div class="sh"><h2>Takımlar</h2><span class="n">${T ? (T.edited ? `<span class="badge y">Admin düzenledi</span>` : `<span class="badge">Öneri</span>`) : `${size}'ya ${size}`}</span></div>`;
  if (lineupEdit && adm && lineupEdit.mid === m.id){
    const all = kadro.concat(yedek), opt = (v, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>`;
    const cnt = Object.values(lineupEdit.map).filter(x => x !== "Y").length;
    return h + `<p class="hint" style="margin:0 2px 10px">Kadroda <b>${cnt}/${cap}</b> kişi var.</p>
      <div class="list ed">${all.map(v => { const cur = lineupEdit.map[v.id] || "Y", [tm, ps] = cur === "Y" ? ["Y", ""] : cur.split("-");
      return `<div class="li ${tm === "Y" ? "off" : ""}"><span class="nm">${esc(vName(v))}<span class="sub2">istediği: ${validPos(v.pos).map(k => POS[k]).join(", ") || "—"}</span></span>
        <select data-act="lu" data-id="${esc(v.id)}" data-k="t">${opt("A", tm)}${esc(tName(m, "A"))}</option>${opt("B", tm)}${esc(tName(m, "B"))}</option>${opt("Y", tm)}Yedek</option></select>
        <select data-act="lu" data-id="${esc(v.id)}" data-k="p" ${tm === "Y" ? "disabled" : ""}>${["KL","DF","OS","FV"].map(k => `${opt(k, ps)}${POS[k]}</option>`).join("")}</select></div>`; }).join("")}</div>
      <div class="acts"><button class="btn pri" data-act="lusave">Kadroyu kaydet</button><button class="btn" data-act="lureset">Öneriye dön</button><button class="btn" data-act="lucancel">Vazgeç</button></div></section>`;
  }
  if (!T) return h + `<p class="hint">Kadro dolunca takımlar burada çıkar.</p>
    ${adm && kadro.length ? `<div class="acts" style="margin-top:10px"><button class="btn" data-act="luedit">Takımları elle kur</button></div>` : ""}</section>`;
  const nm = p => `<span>${esc(vName(p.v))}${p.late ? `<sup>yeni</sup>` : ""}</span>`;
  const card = (t, i) => `<div class="team ${i ? "b" : ""}"><div class="th"><b>${esc(tName(m, t.id))}</b><span>${Object.values(t.lines).flat().length} kişi</span></div>
    ${["FV","OS","DF"].map(k => t.lines[k].length ? `<div class="line"><span class="ab">${POS[k]}</span><div class="ns">${t.lines[k].map(nm).join("")}</div></div>` : "").join("")}
    <div class="line"><span class="ab">Kaleci</span><div class="ns">${t.lines.KL.length ? t.lines.KL.map(nm).join("") : `<span class="rot">Sırayla geçilecek</span>`}</div></div></div>`;
  return h + `<div class="teams">${T.map(card).join("")}</div>
    ${adm ? `<div class="acts" style="margin-top:10px"><button class="btn pri" data-act="luedit">Takımları düzenle</button><button class="btn" data-act="shuffle">Yeniden öner</button>
      <a class="btn lime" href="https://wa.me/?text=${encodeURIComponent(waText(m))}" target="_blank" rel="noopener">${ICON.wa}Paylaş</a></div>` : ""}</section>`;
}

/* ---------- maçlar ---------- */
function viewMatches(){
  const list = results.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.label).localeCompare(String(a.label)));
  if (!list.length) return `<div class="notice"><b>Henüz maç yok</b>Yönetici maç sonuçlarını girdikçe burada listelenir.</div>`;
  sList("maclar", list.map(r => ({ key: "", row: () => {
    const sc = teamScore(r), mk = effMotm(r), mv = mk ? (r.players || []).find(p => p.key === mk) : null;
    return `<a class="li" href="#mac-${esc(r.matchId)}"><span class="tm" style="width:92px">${esc(shortDate(r.date))}${r.label ? `<br>${esc(r.label)}` : ""}</span>
      <span class="nm">${sc ? `<b>${esc(tName(r, "A"))} ${sc.A} – ${sc.B} ${esc(tName(r, "B"))}</b>` : `${(r.players || []).filter(p => p.played).length} oyuncu`}${mv ? `<small class="sub2">Maçın oyuncusu: ${esc(rName(mv))}</small>` : ""}</span><span class="chev">›</span></a>`; } })));
  return `<h1 class="h1">Geçmiş maçlar</h1><ul class="list" id="sl-maclar">${sRows("maclar")}</ul><div id="sf-maclar">${sFoot("maclar")}</div>`;

function viewMatchDetail(id){
  const r = results.find(x => x.matchId === id);
  if (!r) return `<div class="notice"><b>Maç bulunamadı</b><a href="#maclar">Maçlara dön</a></div>`;
  const sc = teamScore(r), ps = (r.players || []).filter(p => p.played), mk = effMotm(r), mv = mk ? ps.find(p => p.key === mk) : null;
  const tl = tallyOf(r), tot = tl.reduce((s, x) => s + x.n, 0), lm = mById(r.matchId);
  const pl = p => `<div class="line"><span class="ab">${p.goals ? p.goals + "G" : ""}</span><div class="ns"><span>${plink(p.no, rName(p))}${p.assists ? `<em>${p.assists} asist</em>` : ""}</span></div></div>`;
  let h = `<p class="hint" style="margin-top:16px"><a href="#maclar">‹ Maçlar</a></p>`;
  const sub = `${r.label ? esc(r.label) + " · " : ""}${esc(shortDate(r.date))}${r.place ? " · " + esc(r.place) : ""}`;
  h += sc ? `<section class="pitch score"><span class="circle"></span><span class="t a">${esc(tName(r, "A"))}</span><span class="s">${sc.A} – ${sc.B}</span><span class="t">${esc(tName(r, "B"))}</span><span class="sub">${sub}</span></section>`
          : `<h1 class="h1">${esc(r.label || shortDate(r.date))}</h1><p class="hint">${sub}</p>`;
  if (mv) h += `<div class="mvp"><div><small>Maçın oyuncusu</small><br><b>${plink(mv.no, rName(mv))}</b></div><small style="text-align:right">${r.motm ? "Admin seçti" : `${(tl.find(x => x.key === mk) || { n: 0 }).n} oy`}</small></div>`;
  else if (voteOpenFor(r.matchId) && lm) h += `<p class="hint">Maçın oyuncusu oylaması sürüyor. Kapanış: ${esc(fmtWhenMs(lm.voteUntil))}.</p>`;
  else if (tl.length) h += `<p class="hint">Oylamada eşitlik çıktı, kararı admin verecek.</p>`;
  if (tl.length && !voteOpenFor(r.matchId)) h += `<section class="sec"><div class="sh"><h2>MVP oylaması</h2><span class="n">${tot} oy</span></div><ul class="list">
    ${tl.slice(0, 5).map(x => `<li class="li" style="display:block"><div style="display:flex;justify-content:space-between"><span class="nm">${plink(x.key.startsWith("n:") ? null : x.key, x.key.startsWith("n:") ? x.name : (players[x.key] ? players[x.key].name : x.name))}</span><span class="pos">${x.n} oy</span></div><div class="bar"><i style="width:${Math.round(x.n / tot * 100)}%"></i></div></li>`).join("")}</ul></section>`;
  const scorers = ps.filter(p => p.goals).sort((a, b) => b.goals - a.goals);
  if (scorers.length) h += `<section class="sec"><div class="sh"><h2>Goller</h2><span class="n">${scorers.reduce((s, p) => s + p.goals, 0)}</span></div><ul class="list">
    ${scorers.map(p => `<li class="li"><span class="nm">${plink(p.no, rName(p))}${p.team ? `<span class="tag ${p.team === "A" ? "ta" : ""}">${esc(tName(r, p.team))}</span>` : ""}</span><span class="pos">${p.goals} gol${p.assists ? " · " + p.assists + " asist" : ""}</span></li>`).join("")}</ul></section>`;
  const A = ps.filter(p => p.team === "A"), B = ps.filter(p => p.team === "B"), N = ps.filter(p => p.team !== "A" && p.team !== "B");
  h += `<section class="sec"><div class="sh"><h2>Kadrolar</h2><span class="n">${ps.length} oyuncu</span></div>`;
  if (A.length || B.length) h += `<div class="teams"><div class="team"><div class="th"><b>${esc(tName(r, "A"))}</b><span>${sc ? sc.A : ""}</span></div>${A.map(pl).join("")}</div>
    <div class="team b"><div class="th"><b>${esc(tName(r, "B"))}</b><span>${sc ? sc.B : ""}</span></div>${B.map(pl).join("")}</div></div>`;
  if (N.length) h += `<ul class="list">${N.map(p => `<li class="li"><span class="nm">${plink(p.no, rName(p))}</span><span class="pos">${p.goals || 0}G ${p.assists || 0}A</span></li>`).join("")}</ul>`;
  h += `</section>`;
  if (isAdmin()) h += `<div class="acts" style="margin-top:20px"><button class="btn" data-act="draft" data-id="${esc(r.matchId)}">Sonucu düzenle</button>
    <button class="btn danger" data-act="delres" data-id="${esc(r.matchId)}">${confirmKey === "del:" + r.matchId ? "Emin misin? Sil" : "Sonucu sil"}</button></div>`;
  return h;
}

/* ---------- oyuncular ---------- */

function viewPlayer(no){

function waText(m){
  if (!m) return "";
  const { cap, kadro, yedek } = derive(m.id), d = mDate(m), ml = mapLinks(m);
  let t = `*FARK HALI SAHA · ${m.label.toLocaleUpperCase("tr")}*\n${d ? dayName(d) + ", " + dateLine(d, m) : ""}\n${m.place || ""}\n${ml ? "Yol tarifi: " + ml.dir + "\n" : ""}\nKADRO (${Math.min(kadro.length, cap)}/${cap})\n`;
  kadro.forEach((v, i) => t += `${i + 1}. ${vName(v)}\n`);
  for (let i = kadro.length; i < cap; i++) t += `${i + 1}. —\n`;
  if (yedek.length){ t += `\nYEDEK\n`; yedek.forEach((v, i) => t += `Y${i + 1}. ${vName(v)}\n`); }
  const T = buildTeams(kadro, cap, m);
  if (T) T.forEach(tm => { t += `\n*${tName(m, tm.id).toLocaleUpperCase("tr")}*\nKL: ${tm.lines.KL.length ? tm.lines.KL.map(p => vName(p.v)).join(", ") : "dönüşümlü"}\n`; ["DF","OS","FV"].forEach(k => { if (tm.lines[k].length) t += `${k}: ${tm.lines[k].map(p => vName(p.v)).join(", ")}\n`; }); });
  return t;
}

async function guard(fn){
  if (busy) return; busy = true; render(true);
  try { await fn(); }
  catch(e){ const c = (e && e.code) || ""; if (c.includes("resource-exhausted")){ quotaHit = true; toast(QUOTA); return; }
    if (e && e.locked){ toast("Hesabın otomatik olarak kilitlendi. Adminle iletişime geç."); return; }
    toast(c.includes("permission") ? "Bu işlem için yetkin yok. Kayıt kapalı ya da yetkin alınmış olabilir." : c.includes("unavailable") || c.includes("network") ? OFFLINE : (e && e.message && !c ? e.message : "Bir hata oldu, tekrar dene.")); }
  finally { busy = false; render(true); }
}
function twoStep(key){ if (confirmKey === key){ confirmKey = null; return true; } confirmKey = key; render(true); setTimeout(() => { if (confirmKey === key){ confirmKey = null; render(); } }, 4000); return false; }
function readForm(){
  const g = k => form[k] ?? "";
  const f = { label: String(g("label")).trim().slice(0, 24) || "Maç", date: String(g("date")), time: String(g("time")) || "21:00", place: String(g("place")).trim().slice(0, 60), loc: String(g("loc")).trim().slice(0, 300),
    teamA: String(g("teamA")).trim().replace(/\s+/g, " ").slice(0, 16), teamB: String(g("teamB")).trim().replace(/\s+/g, " ").slice(0, 16),
    capacity: Math.min(30, Math.max(4, parseInt(g("capacity"), 10) || 12)) & ~1, duration: Math.min(180, Math.max(30, parseInt(g("duration"), 10) || 60)) };
  return { ...f, ...windowOf(f.date, f.time, f.duration) };
}
function startDraft(id){
  const ex = results.find(r => r.matchId === id), m = mById(id);
  if (ex){ draft = { matchId: id, teamA: ex.teamA || (m && m.teamA) || "", teamB: ex.teamB || (m && m.teamB) || "", label: ex.label || (m && m.label) || "", date: ex.date, place: ex.place || "", motm: ex.motm || "", rows: (ex.players || []).map(p => ({ ...p, goals: Number(p.goals) || 0, assists: Number(p.assists) || 0 })) }; }
  else if (m){
    const { cap, kadro, yedek } = derive(id), T = buildTeams(kadro, cap, m), teamOf = {};
    if (T) T.forEach(t => Object.values(t.lines).flat().forEach(p => teamOf[p.v.id] = t.id));
    const mk = (v, played) => ({ key: vKey(v), no: v.guest ? null : v.id, name: vName(v), team: teamOf[v.id] || null, played, goals: 0, assists: 0 });
    draft = { matchId: id, teamA: m.teamA, teamB: m.teamB, label: m.label, date: m.date, place: m.place || "", motm: "", rows: kadro.map(v => mk(v, true)).concat(yedek.map(v => mk(v, false))) };
  } else return;
  if (location.hash !== "#yonetim") location.hash = "yonetim";
  render(true); setTimeout(() => { const el = document.querySelector(".res"); el && el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
}
// Admin: oylaması kapanmış aktif maçların MVP özetini sonuca yaz (arşivden sonra oylar okunmaz)
const mvpSummary = id => { const t = tallyLive(id), r = results.find(x => x.matchId === id); return { mvpTally: t, mvpWinner: winnerOf(t, r ? r.players : []) || "" }; };
let syncing = false; const syncFailed = new Set();
async function syncSummaries(){
  if (syncing || !isAdmin() || !loaded.has("ballots")) return;
  for (const m of activeMatches()){
    if (voteState(m) !== "closed" || syncFailed.has(m.id)) continue;
    const r = results.find(x => x.matchId === m.id); if (!r) continue;
    const s = mvpSummary(m.id);
    if (JSON.stringify(s.mvpTally) === JSON.stringify(r.mvpTally) && s.mvpWinner === r.mvpWinner) continue;
    syncing = true; try { await api.patchResult(m.id, s); } catch(_){ syncFailed.add(m.id); } syncing = false; return;
  }
}

document.addEventListener("submit", e => {
  if (e.target.id !== "authForm") return;
  e.preventDefault();
  const no = $("#aNo").value.trim(), pin = $("#aPin").value.trim();
  authErr = "";
  if (!/^\d+$/.test(no)) { authErr = "Öğrenci numarası sadece rakamlardan oluşmalı."; return render(true); }
  if (authMode === "login"){
    if (!/^\d{4,8}$/.test(pin) && !(pin.length >= 8 && pin.length <= 40)) { authErr = "Şifre 4-8 haneli bir sayı olmalı."; return render(true); }
    busy = true; render(true);
    api.login(no, pin).then(() => { busy = false; }).catch(err => { busy = false; authErr = err.message; render(true); });
    return;
  }
  const pin2 = ($("#aPin2") || {}).value || "";
  if (!/^\d{8}$/.test(no)) { authErr = "Öğrenci numarası 8 haneli olmalı."; return render(true); }
  if (!/^\d{4,8}$/.test(pin)) { authErr = "Şifre 4-8 haneli bir sayı olmalı."; return render(true); }
  if (pin !== pin2.trim()) { authErr = "Şifreler aynı değil."; return render(true); }
  if (authMode === "recover"){
    const code = ($("#aCode").value || "").replace(/\D/g, "");
    if (!/^\d{8}$/.test(code)) { authErr = "Sıfırlama kodu 8 haneli olmalı."; return render(true); }
    busy = true; render(true);
    api.recover({ no, code, pin }).then(() => { busy = false; toast("Yeni şifren kaydedildi"); }).catch(err => { busy = false; authErr = err.message; render(true); });
    return;
  }
  const name = $("#aName").value.trim().replace(/\s+/g, " ");
  if (!NAME_RE.test(name) || !name.includes(" ")) { authErr = "Adını ve soyadını yaz (sadece harf, 5-40 karakter)."; return render(true); }
  if (regPos.length < 3) { authErr = "Sırayla 3 mevki seç."; return render(true); }
  busy = true; render(true);
  api.register({ no, name, pos: regPos.slice(), pin }).then(() => { busy = false; toast("Hoş geldin, " + name.split(" ")[0] + "!"); })
    .catch(err => { busy = false; authErr = err.message; render(true); });
});

(async () => {
  // Başka bir sitenin çerçevesi içinde açılmayı engelle (tıklama tuzağı / clickjacking)
  if (CONFIGURED && window.top !== window.self){ document.body.innerHTML = "<p style='padding:24px;font-family:sans-serif'>Bu sayfa güvenlik nedeniyle başka bir sitenin içinde açılamaz.</p>"; return; }
  if (!CONFIGURED && !DEMO){ $("#root").innerHTML = `<div class="notice"><b>Kurulum tamamlanmadı</b>index.html dosyasının başındaki 4 Firebase değerini doldur (KURULUM.pdf, A6 adımı).</div>`; return; }
  try { api = DEMO ? demoApi() : await firebaseApi(); }
  catch(e){ $("#root").innerHTML = `<div class="notice"><b>Bağlanılamadı</b>Sayfayı yenile.</div>`; return; }
  let subscribed = false;
  setInterval(() => { render(); syncSummaries(); }, 60000);   // oylama açılış/kapanış saatleri için
  api.onAuth(s => {
    sess = s; authPhase = "ready";
    if (s && s.orphan){ authErr = "Kaydın tamamlanmamış görünüyor. Yöneticiye haber ver."; api.logout(); return; }
    if (s && !subscribed){
      subscribed = true;
      api.subscribe((kind, data) => {
        if (kind === "act"){ const prev = myAct; myAct = data && { w: Number(data.w) || 0, n: data.n | 0, l: !!data.l };
          if (myAct && !myAct.l && myAct.n >= ACT_WARN && (!prev || prev.n !== myAct.n) && Date.now() < myAct.w + ACT_WIN) toast("Çok hızlı değişiklik yapıyorsun. 10 dakikada " + ACT_MAX + " değişikliği geçersen hesabın 24 saat kilitlenir.");
          render(); return; }
        if (kind === "admins" && api.watchLocks) setTimeout(() => { if (isAdmin()) api.watchLocks(); }, 0);
        if (kind === "locks"){ locks = (data || []).map(a => ({ id: String(a.id), w: Number(a.w) || 0, n: a.n | 0, l: !!a.l })); render(); return; }
        if (kind.endsWith(":error")){ loaded.add(kind.split(":")[0]); render(); return; }
        loaded.add(kind);
        if (kind === "matches"){ matches = data.map(cleanMatch).filter(m => m.id); api.setActive(activeMatches().map(m => m.id)); }
        else if (kind === "signups") signups = data.map(cleanSignup).filter(s => s.id && s.matchId);
        else if (kind === "results") results = data.map(cleanResult);
        else if (kind === "players") players = Object.fromEntries(data.map(p => [String(p.id), cleanPlayer(p)]));
        else if (kind === "ballots") ballots = data.map(cleanBallot);
        else if (kind === "admins") admins = data.map(a => ({ id: String(a.id), no: str(a.no, 12), name: str(a.name, 40), master: !!a.master, pwOk: !!a.pwOk }));
        render(); syncSummaries();
      });
    }
    fv2 = {};
    if (!s){ authMode = "login"; subscribed = false; loaded = new Set(); matches = []; signups = []; results = []; players = {}; admins = []; ballots = []; regPos = []; selMid = null; resetShown = null; draft = null; formFor = null; }
    render(true);
  });
})();

</script>
